<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Wallet</title>
<style>
:root{--bg:#101923;--card:#182532;--line:#26384a;--tx:#eef1f5;--mut:#8fa1b3;--ac:#f0b429;--bad:#ff7b7b;--ok:#5fd4a0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}h2{font-size:17px;margin:18px 0 8px}p{margin:6px 0}.m{color:var(--mut);font-size:13px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;margin:6px 0}
button{background:var(--ac);color:#1b1500;font-weight:700;border:0;cursor:pointer}button.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}button.d{background:none;color:var(--bad);border:1px solid var(--bad)}
button:disabled{opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}.r>.s{flex:0 0 auto;width:auto}
.nets{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.nets button{width:auto;flex:0 0 auto;padding:8px 12px;margin:0;background:var(--card);color:var(--tx);border:1px solid var(--line);font-weight:500}.nets button.on{background:var(--ac);color:#1b1500;font-weight:700}
.row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.row:first-child{border:0}
.big{font-size:32px;font-weight:700}.addr{word-break:break-all;font-family:ui-monospace,monospace;font-size:13px}
.w{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.w span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{border-color:var(--ac)}a{color:var(--ac)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}.nav button{flex:1;background:none;color:var(--mut);border:0;border-radius:0;margin:0;padding:14px 2px;font-size:12px;font-weight:600}.nav button.on{color:var(--ac)}
#app{padding-bottom:90px}.hide .big,.hide .row>span{filter:blur(9px)}
.mk{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.mk img{width:32px;height:32px;border-radius:50%}.mk>div:nth-child(2){flex:1;min-width:0}.up{color:var(--ok)}.dn{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto}.chips button{width:auto;flex:0 0 auto;padding:6px 12px;margin:0 0 6px;background:var(--card);color:var(--tx);border:1px solid var(--line);font-weight:500}.chips button.on{background:var(--ac);color:#1b1500}
.dg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.dg a,a.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:var(--tx);display:block}
@media(min-width:900px){
#app{max-width:1100px;padding:24px 24px 24px 244px}
.nav{top:0;bottom:auto;right:auto;width:220px;height:100%;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:24px 12px}
.nav button{flex:0 0 auto;text-align:left;padding:12px 16px;font-size:15px;border-radius:10px}.nav button.on{background:var(--bg)}
.nets{flex-wrap:wrap;overflow:visible}.dg{grid-template-columns:repeat(4,1fr)}.w{grid-template-columns:repeat(4,1fr)}
#app>.c,#app>h1,#app>p,#app>select,#app>input,#app>button,#app>.chips,#app>.nets,#app>#ml,#app>#dl,#app>.dg,#app>a{max-width:640px}
body{font-size:16px}}

.pill{width:auto;border-radius:999px;background:#161616;font-weight:700;font-size:17px;padding:10px 16px;margin:0}
.bc{background:linear-gradient(135deg,#2563eb,#1e3a8a);border-radius:18px;padding:18px;margin:10px 0}.bc .big{margin:4px 0}

.ac{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:14px;margin:8px 0}.ac>div:nth-child(2),.ac>a{flex:1;min-width:0}
.ac i,.tl i{font-style:normal;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}

.tag{background:#2a1a00;color:#ffb020;border:1px solid #ffb020;border-radius:5px;font-size:10px;padding:1px 5px}
.pl{min-width:78px;text-align:center;border-radius:7px;padding:9px 4px;font-weight:700;color:#fff}.pl.up{background:#0e7a4b}.pl.dn{background:#c0392b}.mk{content-visibility:auto;contain-intrinsic-size:60px}
.sk{height:68px;background:linear-gradient(90deg,#111,#1c1c1c,#111);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.sk{animation:none}}
.nav button span{display:block;font-size:19px;line-height:1.2}
body{font-size:var(--fs,15px)}
.mg{background:var(--card);border-radius:16px;margin:12px 0;overflow:hidden}.mi{display:flex;align-items:center;gap:14px;padding:18px 16px;font-size:1.15em;border-top:1px solid var(--line);cursor:pointer}.mi:first-child{border:0}.mi b{flex:1;font-weight:600}.mi em{font-style:normal;color:var(--mut);font-size:1.3em}.mic{width:30px;text-align:center;font-size:1.1em}
html[data-theme=l]{--bg:#f4f6f9;--card:#fff;--line:#e2e6eb;--tx:#10151b;--mut:#5f6b78}
[data-theme=l] button.g,[data-theme=l] .chips button,[data-theme=l] .pill,[data-theme=l] .ib span,[data-theme=l] .nets button{background:#e9edf2;color:#10151b}
[data-theme=l] .chips button.on,[data-theme=l] .nets button.on{background:#10151b;color:#fff}[data-theme=l] .sk{background:#e9edf2;animation:none}
html[data-theme=m]{--bg:#0b0b0d;--card:#17171a;--line:#25252d;--tx:#eceaf0;--mut:#9d9aa6;--ac:#ff6a2b;--ok:#2be4a0}
[data-theme=m] .bc{background:linear-gradient(135deg,#6d5ce8,#c2501f)}[data-theme=m] .nav button.on{color:#ff6a2b}[data-theme=m] button.g,[data-theme=m] .pill,[data-theme=m] .ib span,[data-theme=m] .chips button{background:#1e1e23}
.aib{position:fixed;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;margin:0;padding:0;font-weight:800;font-size:18px;z-index:5;box-shadow:0 6px 20px #0008}
.msg{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:88%}.msg.u{background:var(--ac);color:#fff;margin-left:auto}.msg.a{background:var(--card)}
@media(min-width:900px){.aib{bottom:24px}}
@media(min-width:900px){#app{max-width:1400px}#app>.c,#app>h1,#app>p,#app>select,#app>input,#app>button,#app>.chips,#app>.nets,#app>#ml,#app>#dl,#app>.dg,#app>a{max-width:900px}}
button.g,button{padding:11px}.nav button{padding:10px 2px}
</style></head><body><div id="app"></div>
